name: SoftNotch 构建与打包

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: softnotch-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 测试并生成 Apple 芯片版本
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: 检查 Xcode
        run: xcodebuild -version
      - name: 运行回归测试
        run: bash scripts/test.sh
      - name: 构建并打包 SoftNotch
        run: bash scripts/build.sh
      - name: 上传安装包和校验值
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SoftNotch-AppleSilicon-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
